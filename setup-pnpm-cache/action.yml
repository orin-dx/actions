name: 'Setup pnpm store cache'
description: >-
  Caches the pnpm content-addressable store, keyed on the lockfile in
  working-directory. Requires pnpm to already be on PATH.
inputs:
  working-directory:
    description: 'Directory containing pnpm-lock.yaml'
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
