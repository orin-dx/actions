name: 'Setup node & pnpm via proto'
description: >-
  Installs node/pnpm from the calling repo's .prototools via proto, then
  optionally caches the pnpm store. Does not touch Rust -- pair with
  setup-rust separately in jobs that also need a specific cross-compile
  target, since a blanket proto rust install would conflict with it.
inputs:
  working-directory:
    description: 'Directory containing package.json/pnpm-lock.yaml'
    required: false
    default: '.'
  cache:
    description: 'Whether to cache the pnpm store (skip for jobs that never run pnpm install)'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
    - shell: bash
      run: proto install node && proto install pnpm
    # An internal action cannot pin its own release commit without a cycle.
    - id: pnpm-cache
      if: inputs.cache == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.cache == 'true'
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
