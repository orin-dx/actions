name: 'Setup node & pnpm via proto'
description: >-
  Installs node/pnpm from the calling repo's .prototools via proto, then
  optionally caches the pnpm store. Does not touch Rust -- pair with
  setup-rust separately in jobs that also need a specific cross-compile
  target, since a blanket proto rust install would conflict with it.
inputs:
  working-directory:
    description: 'Directory containing package.json/pnpm-lock.yaml'
    required: false
    default: '.'
  cache:
    description: 'Whether to cache the pnpm store (skip for jobs that never run pnpm install)'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: moonrepo/setup-toolchain@v0
    - shell: bash
      run: proto install node && proto install pnpm
    - uses: orin-dx/actions/setup-pnpm-cache@v1
      if: inputs.cache == 'true'
      with:
        working-directory: ${{ inputs.working-directory }}
